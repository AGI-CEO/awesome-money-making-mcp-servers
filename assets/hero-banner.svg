    <text x="160" y="43" font-family="monospace" font-size="12" fill="#94A3B8" text-anchor="middle">SEO/GEO • Paid Ads • Social • Scraping</text>

    <rect x="340" y="0" width="320" height="54" rx="10" fill="#451A03" stroke="#FBBF24" stroke-width="1.5"/>
