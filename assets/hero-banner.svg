  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="2"/>
  <g stroke="#1E293B" stroke-width="1" opacity="0.45">
    <line x1="0" y1="72" x2="1200" y2="72" />
    <line x1="0" y1="144" x2="1200" y2="144" />
    <line x1="0" y1="216" x2="1200" y2="216" />
    <line x1="0" y1="288" x2="1200" y2="288" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="960" y1="0" x2="960" y2="360" />
  </g>
  <rect x="60" y="34" width="440" height="32" rx="16" fill="#1E293B" stroke="#F59E0B" stroke-width="1" />
  <text x="280" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FBBF24" text-anchor="middle" letter-spacing="1.2">THE 3 PILLARS OF DIGITAL BUSINESS • MCP DIRECTORY</text>
  <text x="60" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" fill="#FFFFFF">Awesome Money-Making</text>
  <text x="60" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" fill="url(#gold)">&amp; Business MCP Servers</text>
  <text x="60" y="224" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#94A3B8">Every business boils down to three core functions: generating demand, closing deals, and delivering results.</text>
  <text x="60" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#94A3B8">95+ production MCP servers organized across Marketing, Sales, and Operations &amp; Fulfillment.</text>
  <g transform="translate(60, 274)">
    <rect x="0" y="0" width="320" height="54" rx="10" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.5"/>
