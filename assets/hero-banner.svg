    <text x="500" y="43" font-family="monospace" font-size="12" fill="#D6D3D1" text-anchor="middle">B2B Leads • Cold Outbound • CRM • Booking</text>

    <rect x="680" y="0" width="400" height="54" rx="10" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
